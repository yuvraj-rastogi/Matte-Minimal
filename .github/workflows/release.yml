
name: Publish Matte Minimal

on:
  workflow_dispatch:

  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:

  publish-vscode:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.0.2 publish --oidc


  publish-openvsx:
    name: Publish to Open VSX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Publish to Open VSX
        run: npx --yes ovsx publish --trusted-publishing
